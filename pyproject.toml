[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "chartgen-cli"
version = "0.1.0"
description = "A minimal ReAct agent CLI with ci / bash_executor / web_search / chart_visualization / generate_ppt / domain_data tools"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.61.0",
    "pandas>=3.0.3",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "perplexityai>=0.1.0",
    "python-pptx>=1.0.2",
    "aiohttp>=3.10.0",
    "pyecharts>=2.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
chartgen = "chartgen_cli.main:main"

[tool.setuptools.packages.find]
include = ["chartgen_cli*"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "python-minifier>=3.2.0",
]
