name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: chartgen-darwin-arm64
          - os: macos-13
            artifact: chartgen-darwin-x86_64
          - os: ubuntu-22.04
            artifact: chartgen-linux-x86_64
          - os: windows-latest
            artifact: chartgen-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller python-minifier
          pip install -e .

      - name: Install playwright browsers
        run: playwright install chromium

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --onefile \
            --name chartgen \
            --add-data "chartgen_cli/agent_loop/prompt:chartgen_cli/agent_loop/prompt" \
            --add-data "chartgen_cli/tools/prompt:chartgen_cli/tools/prompt" \
            --hidden-import=playwright \
            --hidden-import=pyecharts \
            --hidden-import=pandas \
            --hidden-import=numpy \
            --hidden-import=matplotlib \
            --hidden-import=pptx \
            --collect-all=pyecharts \
            chartgen_cli/main.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --name chartgen `
            --add-data "chartgen_cli/agent_loop/prompt;chartgen_cli/agent_loop/prompt" `
            --add-data "chartgen_cli/tools/prompt;chartgen_cli/tools/prompt" `
            --hidden-import=playwright `
            --hidden-import=pyecharts `
            --hidden-import=pandas `
            --hidden-import=numpy `
            --hidden-import=matplotlib `
            --hidden-import=pptx `
            --collect-all=pyecharts `
            chartgen_cli/main.py

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: mv dist/chartgen dist/${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: mv dist/chartgen.exe dist/${{ matrix.artifact }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          generate_release_notes: true
