name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: chartgen-darwin-arm64
          - os: macos-13
            artifact: chartgen-darwin-x86_64
          - os: ubuntu-latest
            artifact: chartgen-linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller python-minifier
          pip install -e .

      - name: Install playwright browsers
        run: playwright install chromium

      - name: Minify source
        run: |
          pip install python-minifier
          python -m python_minifier \
            --output /tmp/chartgen_min \
            --rename-globals \
            --remove-literal-statements \
            chartgen_cli/

      - name: Build binary
        run: |
          pyinstaller \
            --onefile \
            --name chartgen \
            --add-data "chartgen_cli/agent_loop/prompt:chartgen_cli/agent_loop/prompt" \
            --hidden-import=playwright \
            --hidden-import=pyecharts \
            --hidden-import=pandas \
            --hidden-import=numpy \
            --hidden-import=matplotlib \
            --hidden-import=pptx \
            --collect-all=pyecharts \
            chartgen_cli/main.py

      - name: Rename artifact
        run: mv dist/chartgen dist/${{ matrix.artifact }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          generate_release_notes: true
